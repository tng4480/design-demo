<!doctype html>
<!-- ATLAS STUDY · liquid-glass
What: an Apple "Liquid Glass"-style lens that bends the content behind it, using an SVG displacement filter in backdrop-filter.
Use for: one floating control (a toolbar, a player, a lens) over rich imagery. Not for whole pages or text-heavy panels.
Technique: feTurbulence/feImage-free radial displacement map built in SVG, applied with backdrop-filter:url(#glass). Chromium renders the refraction;
           Safari and Firefox fall back to a frosted blur via @supports. Approach as described by nikdelvin/liquid-glass (MIT); this code is original.
Reuse: copy the <svg> filter and the .glass rules. Keep text on the glass short and high-contrast.
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid glass</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>{const p=new URLSearchParams(location.search),c=document.documentElement.classList;if(p.has('embedded'))c.add('embedded');if(p.has('capture'))c.add('embedded','capture');}</script><style>.capture .bar,.capture .tabs,.capture .thumb{display:none!important}</style>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{font:15px Geist,system-ui,sans-serif;color:#fff;
 background:
  radial-gradient(circle at 18% 28%,#ff8a3d 0 9%,transparent 9.5%),
  radial-gradient(circle at 70% 64%,#2fc6a8 0 13%,transparent 13.5%),
  repeating-linear-gradient(90deg,#1e2a4a 0 34px,#23335c 34px 68px),#1e2a4a}
.words{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(54px,13vw,170px)/.9 Geist,sans-serif;letter-spacing:-.05em;color:#f4efe6;text-align:center;pointer-events:none}
.glass{position:absolute;left:50%;top:50%;width:min(340px,70vw);height:132px;translate:-50% -50%;border-radius:66px;cursor:grab;touch-action:none;
 backdrop-filter:blur(2px) saturate(1.5);
 box-shadow:inset 0 1px 0 #ffffff99,inset 0 -1px 0 #ffffff33,inset 0 0 22px #ffffff22,0 18px 40px #0005;
 display:flex;align-items:center;justify-content:center;gap:12px}
@supports (backdrop-filter:url(#glass)){.glass{backdrop-filter:url(#glass) saturate(1.5)}}
.glass:active{cursor:grabbing}
.glass button{all:unset;cursor:pointer;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#ffffff1f;font-size:20px;transition:background .2s,transform .15s}
.glass button:hover{background:#ffffff38}.glass button:active{transform:scale(.92)}
.glass button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:12px;color:#ffffffb3}
.embedded .hint{display:none}
</style></head><body>
<div class="words">Bend<br>the light</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <filter id="glass" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <!-- Displacement map: red = x shift, green = y shift. Edges push outward, the centre stays put. -->
  <feImage result="map" preserveAspectRatio="none" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='340' height='132'%3E%3Cdefs%3E%3ClinearGradient id='x'%3E%3Cstop offset='0' stop-color='%23000'/%3E%3Cstop offset='.25' stop-color='%23808080'/%3E%3Cstop offset='.75' stop-color='%23808080'/%3E%3Cstop offset='1' stop-color='%23f00'/%3E%3C/linearGradient%3E%3ClinearGradient id='y' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23000'/%3E%3Cstop offset='.3' stop-color='%23808080'/%3E%3Cstop offset='.7' stop-color='%23808080'/%3E%3Cstop offset='1' stop-color='%230f0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='340' height='132' fill='url(%23x)'/%3E%3Crect width='340' height='132' fill='url(%23y)' style='mix-blend-mode:screen'/%3E%3C/svg%3E"/>
  <feDisplacementMap in="SourceGraphic" in2="map" scale="22" xChannelSelector="R" yChannelSelector="G"/>
 </filter>
</svg>
<div class="glass" role="toolbar" aria-label="Player">
 <button aria-label="Previous">⏮</button><button aria-label="Play">▶</button><button aria-label="Next">⏭</button>
</div>
<p class="hint">Drag the glass across the stripes and the lettering. Refraction renders in Chromium; other browsers show frosted glass.</p>
<script>
const g=document.querySelector('.glass');let drag=null;
g.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX-g.offsetLeft,y:e.clientY-g.offsetTop};g.setPointerCapture(e.pointerId);});
g.addEventListener('pointermove',e=>{if(!drag)return;g.style.left=(e.clientX-drag.x)+'px';g.style.top=(e.clientY-drag.y)+'px';});
g.addEventListener('pointerup',()=>drag=null);
</script></body></html>
