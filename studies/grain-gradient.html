<!doctype html>
<!-- ATLAS STUDY · grain-gradient
What: a soft mesh gradient with film grain, generated as one SVG you can download and drop in as a background.
Use for: section grounds, cover art, slide backgrounds, social cards. Grain stops large gradients from banding and looking plasticky.
Technique: three blurred circles (feGaussianBlur) under feTurbulence noise blended with soft-light. Everything is in the exported SVG, so it
           scales to any size. fffuel.co offers many free generators in this family (grain, mesh, blobs, patterns).
Reuse: copy build(); call it with your palette; set the result as background-image via a data URL or save the file.
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grain gradient</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<script>{const p=new URLSearchParams(location.search),c=document.documentElement.classList;if(p.has('embedded'))c.add('embedded');if(p.has('capture'))c.add('embedded','capture');}</script><style>.capture .bar,.capture .tabs,.capture .thumb{display:none!important}</style>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:13px Geist,system-ui,sans-serif;display:grid;grid-template-rows:1fr auto;background:#111}
#out{min-height:0}#out svg{width:100%;height:100%;display:block}
.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#fffdf8;color:#1b1e19}
label{display:flex;gap:6px;align-items:center}input[type=color]{width:26px;height:26px;border:0;padding:0;background:none}
button{font:inherit;border:1px solid #d3cdbd;background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer}button:hover{background:#efebe1}
</style></head><body>
<div id="out" role="img" aria-label="Grainy gradient"></div>
<div class="bar">
 <label>Colours <input type="color" id="c1" value="#ff6a3d"><input type="color" id="c2" value="#f2c14e"><input type="color" id="c3" value="#3d5afe"><input type="color" id="bg" value="#14121f"></label>
 <label>Grain <input type="range" id="g" min="0" max="100" value="55"></label>
 <button id="shuffle">Shuffle</button><button id="dl">Download SVG</button>
</div>
<script>
const q=s=>document.getElementById(s);let seed=7;
const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
let blobs=[];const place=()=>{blobs=[0,1,2].map(()=>({x:10+rnd()*80,y:10+rnd()*80,r:28+rnd()*22}));};
function build(w=1600,h=1000){const cols=[q('c1').value,q('c2').value,q('c3').value],grain=q('g').value/100;
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice">
<defs><filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${w*.08}"/></filter>
<filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="${(grain*.9).toFixed(2)}"/></feComponentTransfer></filter></defs>
<rect width="100%" height="100%" fill="${q('bg').value}"/>
<g filter="url(#b)">${blobs.map((b,i)=>`<circle cx="${b.x/100*w}" cy="${b.y/100*h}" r="${b.r/100*w}" fill="${cols[i]}"/>`).join('')}</g>
<rect width="100%" height="100%" filter="url(#n)" style="mix-blend-mode:soft-light"/></svg>`;}
function render(){q('out').innerHTML=build();}
place();render();['c1','c2','c3','bg','g'].forEach(id=>q(id).oninput=render);
q('shuffle').onclick=()=>{seed=Math.floor(Math.random()*1e6)+1;place();render();};
q('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([build()],{type:'image/svg+xml'}));a.download='grain-gradient.svg';a.click();};
</script></body></html>
