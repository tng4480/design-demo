<!doctype html>
<!-- ATLAS STUDY · contrast-scale
What: a colour scale solved from target contrast ratios instead of picked by eye: choose a hue, get 10 steps whose contrast against the
      background is exactly what each role needs (borders ~1.3:1, UI 3:1, body text 4.5:1 and 7:1).
Use for: building accessible design tokens for any site, app, chart or slide theme.
Technique: OKLCH colours; for each target ratio, binary-search lightness until WCAG 2 contrast matches; clamp chroma into sRGB.
           Adobe Leonardo (Apache-2.0) is the production tool built on this contrast-first idea.
Reuse: copy oklchToHex(), contrast() and solve(); call solve(hue, chroma, targets, background). Output is copyable CSS variables.
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contrast-first scale</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&display=swap" rel="stylesheet">
<script>{const p=new URLSearchParams(location.search),c=document.documentElement.classList;if(p.has('embedded'))c.add('embedded');if(p.has('capture'))c.add('embedded','capture');}</script><style>.capture .bar,.capture .tabs,.capture .thumb{display:none!important}</style>
<style>
*{box-sizing:border-box}body{margin:0;background:#fffdf8;color:#1b1e19;font:14px Geist,system-ui,sans-serif;padding:22px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}.sub{color:#5f6458;margin:0 0 16px}.embedded h1,.embedded .sub{display:none}
.bar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:16px}label{display:flex;gap:8px;align-items:center}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.step{border-radius:10px;min-height:110px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;font:11px 'Geist Mono',monospace}
.step b{font-size:16px;font-family:Geist,sans-serif}
.use{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.panel{border-radius:12px;padding:16px;border:1px solid}
pre{font:11px/1.6 'Geist Mono',monospace;background:#141a14;color:#d1dfc7;padding:12px;border-radius:10px;overflow:auto;margin:14px 0 0}
button{font:inherit;border:1px solid #d3cdbd;background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer}
@media(max-width:620px){.scale{grid-template-columns:repeat(5,1fr)}.use{grid-template-columns:1fr}}
</style></head><body>
<h1>Contrast-first colour scale</h1><p class="sub">Every step is solved to a contrast target against the background, so roles stay accessible whatever hue you pick.</p>
<div class="bar"><label>Hue <input id="h" type="range" min="0" max="360" value="150"></label><label>Chroma <input id="c" type="range" min="0" max="20" value="12"></label>
<label>Background <select id="bg"><option value="#ffffff">White</option><option value="#0b0d0c">Near black</option></select></label><button id="copy">Copy CSS</button></div>
<div class="scale" id="scale"></div>
<div class="use" id="use"></div>
<pre id="css"></pre>
<script>
const T=[1.08,1.18,1.32,1.6,2.1,3,4.5,6,8.5,12];
const roles=['Subtle bg','Hover bg','Border','Strong border','Decorative','UI / icons 3:1','Text 4.5:1','Text strong','Heading','Max'];
function oklchToRgb(L,C,h){const a=C*Math.cos(h*Math.PI/180),b=C*Math.sin(h*Math.PI/180);
 const l=(L+.3963377774*a+.2158037573*b)**3,m=(L-.1055613458*a-.0638541728*b)**3,s=(L-.0894841775*a-1.291485548*b)**3;
 return[4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s];}
const inGamut=c=>c.every(v=>v>=-1e-4&&v<=1.0001);
const toHex=c=>'#'+c.map(v=>{v=Math.min(1,Math.max(0,v));v=v<=.0031308?12.92*v:1.055*v**(1/2.4)-.055;return Math.round(v*255).toString(16).padStart(2,'0');}).join('');
const lum=hex=>{const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2];};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
function colour(L,C,h){let c=C;while(c>0&&!inGamut(oklchToRgb(L,c,h)))c-=.002;return toHex(oklchToRgb(L,Math.max(0,c),h));}
// On a light background contrast falls as lightness rises; on a dark one it rises. Either way, "needs to be lighter" moves lo up.
function solve(h,C,targets,bg){const dark=lum(bg)<.2;return targets.map(t=>{let lo=0,hi=1;for(let i=0;i<30;i++){const mid=(lo+hi)/2,k=contrast(colour(mid,C,h),bg);
 const lighter=dark?k<t:k>t;if(lighter)lo=mid;else hi=mid;}
 // Return the bound that is known to meet the target, so hex rounding never lands at 2.98:1 for a 3:1 role.
 return colour(dark?hi:lo,C,h);});}
function render(){const h=+q('h').value,C=q('c').value/100,bg=q('bg').value,s=solve(h,C,T,bg);document.body.style.background=bg;document.body.style.color=bg==='#ffffff'?'#1b1e19':'#ecefea';
 q('scale').innerHTML=s.map((hex,i)=>`<div class="step" style="background:${hex};color:${contrast(hex,'#ffffff')>4.5?'#fff':'#111'}"><b>${(i+1)*100}</b><span>${roles[i]}<br>${hex}<br>${contrast(hex,bg).toFixed(2)}:1</span></div>`).join('');
 q('use').innerHTML=`<div class="panel" style="background:${s[0]};border-color:${s[2]};color:${s[8]}"><b>Card on step 100</b><p style="color:${s[6]};margin:6px 0 10px">Body text uses step 700, at least 4.5:1.</p><span style="display:inline-block;background:${s[6]};color:${bg};padding:8px 14px;border-radius:99px">Primary action</span></div>
 <div class="panel" style="background:${bg};border-color:${s[3]};color:${s[8]}"><b>Lines and icons</b><p style="color:${s[6]};margin:6px 0 10px">Borders use 300-400; icons need step 600 (3:1).</p><svg width="120" height="24"><circle cx="12" cy="12" r="9" fill="none" stroke="${s[5]}" stroke-width="3"/><rect x="34" y="4" width="80" height="16" rx="8" fill="${s[1]}" stroke="${s[2]}"/></svg></div>`;
 q('css').textContent=':root{\n'+s.map((hex,i)=>`  --scale-${(i+1)*100}: ${hex}; /* ${contrast(hex,bg).toFixed(2)}:1 on ${bg} */`).join('\n')+'\n}';}
const q=id=>document.getElementById(id);['h','c','bg'].forEach(i=>q(i).oninput=render);
q('copy').onclick=()=>navigator.clipboard?.writeText(q('css').textContent);render();
</script></body></html>
