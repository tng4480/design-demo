<!doctype html>
<!-- ATLAS STUDY · dither
What: an ordered (Bayer) dither of a lit, slowly turning sphere, drawn in two inks at chunky pixel sizes.
Use for: developer and AI brand moments, retro-tech heroes, section dividers. One per page.
Technique: render a shaded field at low resolution in Canvas 2D, threshold each pixel against a 4x4 or 8x8 Bayer matrix, scale up with
           image-rendering:pixelated. No WebGL needed. Paper Shaders ships a production Dithering shader (React or vanilla) for the same look.
Reuse: copy draw() and the bayer() matrices; change INK/PAPER. Pauses when hidden and under reduced motion.
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dither</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>{const p=new URLSearchParams(location.search),c=document.documentElement.classList;if(p.has('embedded'))c.add('embedded');if(p.has('capture'))c.add('embedded','capture');}</script><style>.capture .bar,.capture .tabs,.capture .thumb{display:none!important}</style>
<style>
:root{--paper:#0b0d0c;--ink:#c6f36b}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--paper);color:#ecefea;font:12px 'JetBrains Mono',ui-monospace,monospace;display:grid;grid-template-rows:1fr auto}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-top:1px solid #262a28}
label{display:flex;gap:8px;align-items:center;color:#9aa19b}
select,input{accent-color:var(--ink);background:#141716;color:#ecefea;border:1px solid #262a28;border-radius:6px;padding:4px 6px;font:inherit}
.title{position:absolute;left:20px;top:18px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;mix-blend-mode:difference}
.embedded .title{display:none}
</style></head><body>
<div class="title">Ordered dither / 2 inks</div>
<canvas id="c" aria-label="Dithered sphere animation"></canvas>
<div class="bar">
 <label>Matrix <select id="m"><option value="4">Bayer 4×4</option><option value="8" selected>Bayer 8×8</option></select></label>
 <label>Pixel <input id="px" type="range" min="2" max="8" value="4"></label>
 <label>Ink <select id="pal"><option value="#c6f36b|#0b0d0c">Lime on black</option><option value="#ff5b2e|#f3eee4">Vermilion on paper</option><option value="#9fd5ff|#14213d">Ice on navy</option></select></label>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),q=s=>document.getElementById(s);
function bayer(n){if(n===1)return[[0]];const p=bayer(n/2),r=[];for(let y=0;y<n;y++){r[y]=[];for(let i=0;i<n;i++){const v=p[y%(n/2)][i%(n/2)]*4;r[y][i]=v+[[0,2],[3,1]][Math.floor(y/(n/2))][Math.floor(i/(n/2))];}}return r;}
let B=bayer(8),N=8,img,W,H;
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let paused=false;addEventListener('message',e=>{if(e.data?.type==='atlas-motion')paused=e.data.paused;});
function size(){const px=+q('px').value,r=c.getBoundingClientRect();W=Math.max(40,Math.floor(r.width/px));H=Math.max(30,Math.floor(r.height/px));c.width=W;c.height=H;img=x.createImageData(W,H);}
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function draw(t){const [ink,paper]=q('pal').value.split('|').map(hex);document.body.style.background='rgb('+paper+')';
 const R=Math.min(W,H)*.38,cx=W*.5,cy=H*.5,a=t*.0004,lx=Math.cos(a),ly=-.55,lz=Math.sin(a),d=img.data;
 for(let y=0;y<H;y++)for(let i=0;i<W;i++){const dx=(i-cx)/R,dy=(y-cy)/R,r2=dx*dx+dy*dy;let v;
  if(r2<1){const dz=Math.sqrt(1-r2);v=Math.max(0,dx*lx+dy*ly+dz*lz)*.9+.08;v+=.06*Math.sin(dx*9+t*.001)*Math.sin(dy*9);}
  else v=.18*(1-y/H)*(.6+.4*Math.sin(i*.05+t*.0005));
  const on=v>(B[y%N][i%N]+.5)/(N*N),o=(y*W+i)*4,col=on?ink:paper;d[o]=col[0];d[o+1]=col[1];d[o+2]=col[2];d[o+3]=255;}
 x.putImageData(img,0,0);}
function loop(t){if(!paused&&!document.hidden)draw(t);if(!still)requestAnimationFrame(loop);}
q('m').onchange=e=>{N=+e.target.value;B=bayer(N);draw(performance.now());};
q('px').oninput=()=>{size();draw(performance.now());};q('pal').onchange=()=>draw(performance.now());
new ResizeObserver(()=>{size();draw(performance.now());}).observe(c);size();requestAnimationFrame(loop);
</script></body></html>
